name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Full Stedi 835 lifecycle (paid / partially paid / denied test ERAs):
  # weekly, plus on demand from the Actions tab.
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      stedi_e2e_full:
        description: 'Run the full Stedi 835 lifecycle (slow: polls for test ERAs)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Real PostgreSQL for the demo-provisioning integration test below. The
    # demo payment backfill (#483) selected a column the claims table does not
    # have; its unit tests mock pg, so production found out (2026-11-19).
    # Starting the container adds ~15-20s to the job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: demo_provision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: scripts/lint-schema-diff.sh diffs shared/schema.ts
          # against the merge base. With the default shallow clone the base
          # ref is unresolvable and that check fails closed.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint migrations for zero-downtime safety
        run: bash scripts/lint-migrations.sh

      # The check above scans migrations/*.sql, which is NOT what production
      # applies — `drizzle-kit push --force` applies the shared/schema.ts diff
      # directly (see docs/migration-safety-gap.md). This step lints that diff,
      # so destructive schema changes are actually caught before merge.
      - name: Lint schema.ts diff for destructive changes
        run: bash scripts/lint-schema-diff.sh

      - name: TypeScript type checking
        run: npm run check

      - name: Run tests
        run: npm test

      # `npm test` is server-only (vitest.config.ts includes server/**); the
      # client suite has its own config and never ran in CI before this step.
      - name: Run client tests
        run: npm run test:client

      # Provision the demo practice through the "Try Free Demo" path
      # (ensureDemoPractice: create, seed, the seeded-practice repairs and the
      # payment backfill) against the Postgres service, with the schema
      # generated from shared/schema.ts, and assert the remittance, posting,
      # copay and payer-link rows exist. The suite self-skips without this
      # variable, so `npm test` above never needs a database.
      - name: Demo provisioning against real Postgres
        env:
          DEMO_PROVISION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/demo_provision
          # Quoted: an all-digit value is a YAML integer, which arrived as "0".
          PHI_ENCRYPTION_KEY: "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90"
          SESSION_SECRET: ci-demo-provision-session-secret-not-a-real-secret
          TIMEZONE: America/New_York
        run: npm run test:demo-provision

      # End-to-end claims flow against Stedi TEST MODE (real network, fake
      # payer). Submits a claim to the Stedi Test Payer and asserts acceptance.
      # Runs for real only when the STEDI_TEST_API_KEY secret is configured —
      # without it the suite self-skips and this step passes in seconds. The
      # slow full-lifecycle variant (poll for the test 835, run the
      # normalizer) is opt-in via STEDI_E2E_FULL=1 for manual/nightly runs.
      - name: Stedi test-mode end-to-end
        env:
          STEDI_TEST_API_KEY: ${{ secrets.STEDI_TEST_API_KEY }}
          STEDI_E2E_FULL: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stedi_e2e_full)) && '1' || '' }}
        run: npm run test:stedi-e2e
