name: SOAP Generation Pipeline Eval (release gate)

# BLOCKING release gate for the real SOAP generation pipeline -- distinct
# from eval-prompt.yml (the raw-output diagnostic, unchanged, still
# non-blocking). See scripts/eval-soap-generation-pipeline.ts's header for
# the full rationale; short version: this calls the real
# generateSoapNoteAndBilling(), the exact function the production route
# calls, with only `storage` mocked -- every backstop, every prompt
# builder, and final response assembly all run for real. A violation that
# the raw diagnostic still flags (because it bypasses every backstop by
# design) is NOT a failure here unless it survives the real pipeline.
#
# LABEL GATING (required check #6): spend is gated entirely by the job-level
# `if:` below (the `ready-for-eval` label), NOT by the workflow trigger.
#
# FIXED 2026-11-02: the trigger originally also carried a `paths:` filter
# (the list under TRIGGER COVERAGE below), on the theory that an unrelated
# PR shouldn't even invoke this workflow. That broke required-status-check
# semantics: when `pipeline-eval` is a required check and a PR's commit
# doesn't match the path filter, GitHub's classic branch protection never
# creates ANY run for that commit -- not even a "skipped" one -- so the
# required check sits as "Expected -- Waiting for status to be reported"
# FOREVER and blocks merge. Confirmed live: PR #441 (a client-only change,
# no path-filter match) got stuck exactly this way minutes after this
# workflow was wired in as required. A job's `if:` evaluating false
# produces a "skipped" conclusion, which DOES satisfy a required check --
# only the workflow-level `paths:` filter (no run created at all) causes
# the stuck-forever failure mode. So: the workflow now triggers on every
# PR unconditionally; the `if:` below is the only gate, for both "should
# this actually spend money" and "does a status get reported for every
# commit" at once.
#
#   - A PR that doesn't carry `ready-for-eval` gets an instant "skipped"
#     status -- satisfies the required check, never pending-forever.
#   - Adding the label fires a real run tied to the commit present at that
#     moment (the `labeled` trigger below).
#   - Any LATER push re-fires via the `synchronize` trigger (re-checked
#     against the label by the same `if:`) -- so a passing run is always
#     tied to the CURRENT head commit's code AND the eval config in that
#     same commit. A push after a passing run invalidates it; the label is
#     never a one-time token that reuses an old result.
#   - Removing and re-adding the label (or closing the label dialog without
#     re-adding) does not forge a pass -- GitHub's required-checks model
#     keys a check's state to a commit SHA, not to the label's current
#     on/off state, so there's no path to showing green without an actual
#     run against that SHA.
#
# TRIGGER COVERAGE (requirement #5): every file that can change the final
# output still matters for deciding WHEN to label a PR `ready-for-eval` --
# it's just no longer a workflow-level path filter (see the fix above):
#   - server/services/aiSoapBillingService.ts   (prompt builders, every
#                                                 backstop, the pipeline
#                                                 function itself, final
#                                                 response assembly)
#   - server/services/aiProvider.ts             (model/provider config,
#                                                 which model/client is used)
#   - server/utils/phiAiGuard.ts                (can gate the AI path off
#                                                 entirely)
#   - server/storage/index.ts                   (what real storage methods
#                                                 this eval monkey-patches
#                                                 point to -- a signature
#                                                 change here can silently
#                                                 break the mock)
#   - scripts/eval-soap-generation-pipeline.ts  (the eval script itself)
#   - .github/workflows/eval-prompt-pipeline.yml (this workflow itself)
#
# COST: makes real, billed API calls (default 3 samples/scenario x 5
# scenarios = 15 generation calls + up to 12 judge calls), ONLY on a
# labeled PR. See the PR description this workflow shipped with for the
# per-run/per-month estimate Daniel approved before this was wired in as
# required.
#
# NOT a substitute for eval-prompt.yml's weekly schedule: that diagnostic
# still runs on its own cadence (10 samples/scenario) to catch drift from
# Anthropic-side model changes between PRs; this workflow only spends
# anything on a labeled PR or workflow_dispatch, by design, to keep
# routine PRs from ever costing money even though every one of them now
# triggers (cheaply) the workflow itself.

on:
  pull_request:
    branches: [main]
    # `opened`/`reopened` are REQUIRED here, not just labeled/synchronize
    # (fixed 2026-11-03): a freshly opened single-commit PR fires only
    # `opened`. Without it no run -- not even "skipped" -- was created for
    # the PR's first commit, so the required check sat as "Expected" and
    # blocked merge until someone pushed a second commit. PR #442 hit this
    # the day after the paths: filter fix above for the same reason.
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:

jobs:
  pipeline-eval:
    name: pipeline-eval
    runs-on: ubuntu-latest
    # The only gate, for both "should this spend money" and "does a status
    # get reported for every commit" at once -- see FIXED 2026-11-02 above.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready-for-eval')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SOAP generation PIPELINE eval against the live model (final output, real backstops)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SAMPLES_PER_SCENARIO: 3
        run: npm run eval:soap-generation-pipeline

      - name: Upload eval results for replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-soap-generation-pipeline-results
          path: .eval-results/
          if-no-files-found: ignore
