name: SOAP Generation Pipeline Eval (release gate)

# BLOCKING release gate for the real SOAP generation pipeline -- distinct
# from eval-prompt.yml (the raw-output diagnostic, unchanged, still
# non-blocking). See scripts/eval-soap-generation-pipeline.ts's header for
# the full rationale; short version: this calls the real
# generateSoapNoteAndBilling(), the exact function the production route
# calls, with only `storage` mocked -- every backstop, every prompt
# builder, and final response assembly all run for real. A violation that
# the raw diagnostic still flags (because it bypasses every backstop by
# design) is NOT a failure here unless it survives the real pipeline.
#
# LABEL GATING (required check #6): this workflow only runs a sample on a
# PR carrying the `ready-for-eval` label. Making this workflow's job a
# required status check (Settings -> Branches -> branch protection rule for
# `main` -> add "pipeline-eval" under required status checks) means:
#   - A PR that touches a covered path (below) but has NEITHER the label
#     NOR a run stays "Expected -- Waiting for status to be reported"
#     forever -- pending and BLOCKED, never silently skipped-and-green.
#   - Adding the label fires a run tied to the commit present at that
#     moment (the `labeled` trigger below).
#   - Any LATER push re-fires via the `synchronize` trigger (guarded by the
#     `if:` on the job, which re-checks the label on every event) -- so a
#     passing run is always tied to the CURRENT head commit's code AND the
#     eval config in that same commit. A push after a passing run
#     invalidates it; the label is never a one-time token that reuses an
#     old result.
#   - Removing and re-adding the label (or closing the label dialog without
#     re-adding) does not forge a pass -- GitHub's required-checks model
#     keys a check's state to a commit SHA, not to the label's current
#     on/off state, so there's no path to showing green without an actual
#     run against that SHA.
#
# TRIGGER COVERAGE (requirement #5): every file that can change the final
# output is in the path filter below --
#   - server/services/aiSoapBillingService.ts   (prompt builders, every
#                                                 backstop, the pipeline
#                                                 function itself, final
#                                                 response assembly)
#   - server/services/aiProvider.ts             (model/provider config,
#                                                 which model/client is used)
#   - server/utils/phiAiGuard.ts                (can gate the AI path off
#                                                 entirely)
#   - server/storage/index.ts                   (what real storage methods
#                                                 this eval monkey-patches
#                                                 point to -- a signature
#                                                 change here can silently
#                                                 break the mock)
#   - scripts/eval-soap-generation-pipeline.ts  (the eval script itself)
#   - .github/workflows/eval-prompt-pipeline.yml (this workflow itself)
#
# COST: makes real, billed API calls (default 3 samples/scenario x 5
# scenarios = 15 generation calls + up to 12 judge calls). See the PR
# description this workflow shipped with for the per-run/per-month
# estimate Daniel approved before this was wired in as required.
#
# NOT a substitute for eval-prompt.yml's weekly schedule: that diagnostic
# still runs on its own cadence (10 samples/scenario) to catch drift from
# Anthropic-side model changes between PRs; this workflow only fires on a
# labeled/re-synchronized PR or workflow_dispatch, by design, to keep
# routine PRs that don't touch these paths from ever spending anything.

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
    paths:
      - 'server/services/aiSoapBillingService.ts'
      - 'server/services/aiProvider.ts'
      - 'server/utils/phiAiGuard.ts'
      - 'server/storage/index.ts'
      - 'scripts/eval-soap-generation-pipeline.ts'
      - '.github/workflows/eval-prompt-pipeline.yml'
  workflow_dispatch:

jobs:
  pipeline-eval:
    name: pipeline-eval
    runs-on: ubuntu-latest
    # Re-evaluated on every triggering event (including `synchronize`), so
    # a PR that loses the label, or never had it, correctly shows this
    # check as not-yet-run rather than skipped-and-green when the check is
    # marked required.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ready-for-eval')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SOAP generation PIPELINE eval against the live model (final output, real backstops)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SAMPLES_PER_SCENARIO: 3
        run: npm run eval:soap-generation-pipeline

      - name: Upload eval results for replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-soap-generation-pipeline-results
          path: .eval-results/
          if-no-files-found: ignore
