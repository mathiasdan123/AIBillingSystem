name: SOAP Generation Fabrication Eval

# Live-model regression check for scripts/eval-soap-generation.ts. Guards
# against the fabrication pattern that resurfaced across #421-#425 despite
# each prompt fix explicitly naming the prior one: every other automated
# check tests the PROMPT we send, never the OUTPUT the model actually
# returns. This calls the real Anthropic API against a fixed set of
# adversarial scenarios (a brand-new patient with no history, blank optional
# fields) and asserts the raw output -- deterministically for known-bad
# strings, and via a second real-model call (the semantic judge) that must
# quote the exact offending sentence, so a reworded defect still fails.
#
# Runs on PRs that touch the generation prompt OR provider/model routing
# (path filter below), weekly regardless of code changes (schedule, below),
# or on demand (workflow_dispatch) -- and only does anything if the
# ANTHROPIC_API_KEY secret is configured -- without it, eval-soap-generation.ts
# self-skips and this step passes in seconds (same convention as the Stedi
# test-mode e2e step in ci.yml). Add the secret in repo Settings -> Secrets
# and variables -> Actions to turn this from a no-op into a real gate.
#
# Makes real, billed API calls (10 samples per scenario by default, plus one
# judge call per sample) — that's why this is its own path-filtered workflow
# rather than part of every push in ci.yml.
#
# WHY A WEEKLY SCHEDULE, NOT JUST A PATH FILTER: a path filter only fires
# when THIS repo's code changes -- it cannot catch Anthropic silently
# deprecating or changing the behavior of a model this code already calls.
# That's not hypothetical: while scoping this workflow, aiSoapBillingService.ts's
# hardcoded `claude-sonnet-4-5` turned out to already be deprecated
# (retiring 2026-11-30), discovered by accident, not by any trigger here.
# A scheduled run surfaces exactly that class of drift on its own, without
# anyone needing to touch the repo first.

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/services/aiSoapBillingService.ts'
      - 'server/services/aiProvider.ts'
  schedule:
    # Wednesdays 07:00 UTC -- a different day than ci.yml's Monday Stedi
    # job, so scheduled AI-cost workflows don't all land on the same day.
    - cron: '0 7 * * 3'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SOAP generation fabrication eval against the live model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:soap-generation

      - name: Upload eval results for replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-soap-generation-results
          path: .eval-results/
          if-no-files-found: ignore
